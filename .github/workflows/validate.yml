name: Validate Worker
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/civitai-streaming-import]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/index.js
      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir ./dist
